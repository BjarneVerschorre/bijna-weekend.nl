<!doctype html>
<html lang="nl">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="description" content="Countdown naar het weekend – elke week tot vrijdag 17:00. In het weekend tonen we WEEKEND 🎉 tot maandag 08:00." />
	<meta name="theme-color" content="#111827" />
	<title>Weekend Countdown</title>

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="./styles.css" />
</head>
<body class="site">
	<main class="site__main" role="main">
		<section class="countdown" aria-label="Countdown naar het weekend">
			<h1 class="countdown__title">Countdown Naar Het Weekend</h1>

			<div class="countdown__card" role="group" aria-live="polite" aria-atomic="true">

				<div class="countdown__grid" id="js-grid" aria-hidden="false">
					<div class="countdown__segment">
						<div class="countdown__time" id="js-days">0</div>
						<div class="countdown__label">dagen</div>
					</div>
					<div class="countdown__separator" aria-hidden="true">:</div>
					<div class="countdown__segment">
						<div class="countdown__time" id="js-hours">00</div>
						<div class="countdown__label">uren</div>
					</div>
					<div class="countdown__separator" aria-hidden="true">:</div>
					<div class="countdown__segment">
						<div class="countdown__time" id="js-minutes">00</div>
						<div class="countdown__label">min</div>
					</div>
					<div class="countdown__separator" aria-hidden="true">:</div>
					<div class="countdown__segment">
						<div class="countdown__time" id="js-seconds">00</div>
						<div class="countdown__label">sec</div>
					</div>
				</div>

				<div class="countdown__weekend" id="js-weekend" aria-hidden="true" hidden>
					<span class="countdown__weekend-text" role="img" aria-label="Weekend met feest">🎉🎉 WEEKEND 🎉🎉</span>
				</div>
			</div>

		</section>
	</main>

	<script src="./script.js" defer></script>
</body>
</html>
